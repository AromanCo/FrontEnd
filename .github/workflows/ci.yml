name: Frontend CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  real-stack-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out FrontEnd
        uses: actions/checkout@v4

      - name: Check out pinned public Backend
        uses: actions/checkout@v4
        with:
          repository: AromanCo/Backend
          ref: a59a97728b2f9c0bc34c03b8c356dd0bd6e0bfb9
          path: backend-pinned

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FrontEnd and Backend runtime dependencies
        run: |
          npm ci
          python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.34,<1' 'pydantic-settings>=2.7,<3' 'sqlalchemy>=2.0,<3' 'alembic>=1.14,<2'
          npx playwright install --with-deps chromium
          echo "CHROME_BIN=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Run real FastAPI and Next.js Chromium journey
        env:
          AROMAN_TEST_BACKEND_DIR: ${{ github.workspace }}/backend-pinned
          AROMAN_TEST_PYTHON: python
        run: npm run test:browser:real-stack

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FRONTEND_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_AROMAN_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Guided Save fixture contract
        run: npm run test:fixture:guided-save

      - name: Production build
        run: npm run build

      - name: Detect system Chrome
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_bin" ]; then
            echo "System Chrome was not found on the ubuntu-24.04 runner." >&2
            exit 1
          fi
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "Using system Chrome at $chrome_bin"

      - name: Run isolated browser journeys
        run: |
          set -Eeuo pipefail
          server_log="$(mktemp)"
          server_pid=""

          cleanup() {
            result=$?
            trap - EXIT
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            if [ "$result" -ne 0 ]; then
              echo "Next.js production server diagnostics:" >&2
              cat "$server_log" >&2
            fi
            exit "$result"
          }
          trap cleanup EXIT

          ./node_modules/.bin/next start --hostname 0.0.0.0 --port 3000 >"$server_log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/login >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next.js production server exited before becoming ready (attempt $attempt)." >&2
              cat "$server_log" >&2
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Next.js production server did not become ready at http://localhost:3000/login within 30 seconds." >&2
            cat "$server_log" >&2
            exit 1
          fi

          npm run test:browser:auth
          npm run test:browser:guided-save
          npm run test:browser:guided-creative-save
          npm run test:browser:save-retry
          npm run test:browser:save-session-expiry
          npm run test:browser:save-pending
          npm run test:browser:mobile-rtl
          npm run test:browser:firefox -- --strict-a11y
          npm run test:browser:webkit -- --strict-a11y
