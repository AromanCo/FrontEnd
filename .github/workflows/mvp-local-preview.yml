name: MVP local preview

on:
  pull_request:
    branches: [develop, feat/local-mvp-preview, feat/local-demo-cart, feat/local-demo-orders, feat/local-demo-order-history]
    paths:
      - '.github/workflows/mvp-local-preview.yml'
      - 'scripts/real-stack-runner.mjs'
      - 'scripts/real-stack-api.py'
      - 'src/components/catalog/**'
      - 'src/app/cart/**'
      - 'src/app/account/**'
      - 'src/app/shop/**'
      - 'src/lib/demo-cart.ts'
      - 'src/lib/release-scope.ts'

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AromanCo/Backend
          ref: 6904a81e47f69add887b83852239dbe08061e113
          path: backend-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install ./backend-preview
      - name: Start the local preview and verify the demo order
        env:
          AROMAN_TEST_BACKEND_DIR: ${{ github.workspace }}/backend-preview
          AROMAN_TEST_PYTHON: python
        run: |
          log="$RUNNER_TEMP/aroman-preview.log"
          node scripts/real-stack-runner.mjs mvp-checkout >"$log" 2>&1 &
          preview_pid=$!
          trap 'kill -TERM "$preview_pid" 2>/dev/null || true; wait "$preview_pid" || true; cat "$log"' EXIT
          for attempt in {1..90}; do
            if grep -q '^Local FakeSMS socket: ' "$log"; then break; fi
            kill -0 "$preview_pid"
            sleep 1
          done
          web="$(sed -n 's/^AROMAN MVP: //p' "$log")"
          api="$(sed -n 's/^AROMAN API: //p' "$log")"
          socket="$(sed -n 's/^Local FakeSMS socket: //p' "$log")"
          test -n "$web" && test -n "$api" && test -S "$socket"
          test "$(stat -c '%a' "$socket")" = 600
          curl --fail --silent --show-error --max-time 20 "$web/shop" -o /dev/null
          WEB_ORIGIN="$web" API_BASE="$api" OTP_SOCKET="$socket" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createConnection } from 'node:net';
          import { chromium } from 'playwright';

          const response = await fetch(`${process.env.API_BASE}/products?limit=20`);
          assert.equal(response.status, 200);
          const products = await response.json();
          assert.equal(products.length, 6);
          const garden = products.find(product => product.slug === 'aroman-garden-demo');
          assert.ok(garden);
          const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          try {
            const page = await browser.newPage({ baseURL: process.env.WEB_ORIGIN });
            await page.goto(`/shop/${garden.id}`);
            await page.getByRole('button', { name: 'افزودن به سبد آزمایشی' }).click();
            await page.getByRole('link', { name: 'مشاهدهٔ سبد آزمایشی' }).click();
            await page.getByText('جمع سبد ۱٬۲۰۰٬۰۰۰ ریال', { exact: true }).waitFor();
            await page.getByRole('combobox', { name: /تعداد/ }).selectOption('2');
            await page.getByText('جمع سبد ۲٬۴۰۰٬۰۰۰ ریال', { exact: true }).waitFor();
            await page.reload();
            await page.getByText('جمع سبد ۲٬۴۰۰٬۰۰۰ ریال', { exact: true }).waitFor();
            await page.getByRole('button', { name: /حذف/ }).click();
            await page.getByText('سبد آزمایشی خالی است.', { exact: true }).waitFor();

            await page.goto(`/shop/${garden.id}`);
            await page.getByRole('button', { name: 'افزودن به سبد آزمایشی' }).click();
            await page.getByRole('link', { name: 'مشاهدهٔ سبد آزمایشی' }).click();
            await page.getByRole('button', { name: 'ورود برای ثبت سفارش آزمایشی' }).click();
            const login = page.getByRole('dialog', { name: 'ورود برای سفارش آزمایشی' });
            await login.getByLabel('شماره موبایل').fill('09990000001');
            await login.getByRole('button', { name: 'دریافت کد' }).click();
            await login.getByLabel('کد شش رقمی').waitFor();
            const code = await new Promise((resolve, reject) => {
              const socket = createConnection(process.env.OTP_SOCKET);
              let message = '';
              socket.setEncoding('utf8');
              socket.on('connect', () => socket.write('+989990000001\n'));
              socket.on('data', chunk => { message += chunk; });
              socket.on('error', reject);
              socket.on('end', () => resolve(JSON.parse(message).code));
              socket.setTimeout(5_000, () => socket.destroy(new Error('FakeSMS read timed out')));
            });
            assert.match(code, /^\d{6}$/);
            await login.getByLabel('کد شش رقمی').fill(code);
            await login.getByRole('button', { name: 'تأیید و ورود' }).click();
            await page.getByRole('button', { name: 'ثبت سفارش آزمایشی', exact: true }).click();
            const receipt = page.getByRole('status', { name: 'رسید سفارش آزمایشی' });
            await receipt.getByText('سفارش آزمایشی ثبت شد.').waitFor();
            await receipt.getByText('مبلغ سفارش ۱٬۲۰۰٬۰۰۰ ریال', { exact: true }).waitFor();
            const orderId = await receipt.locator('bdi').innerText();
            assert.match(orderId, /^[a-f0-9-]{36}$/i);
            await page.getByText('سبد آزمایشی خالی است.', { exact: true }).waitFor();
            await receipt.getByRole('link', { name: 'مشاهدهٔ سفارش‌های آزمایشی' }).click();
            const history = page.getByRole('region', { name: 'سفارش‌های آزمایشی' });
            await history.getByText(orderId, { exact: true }).waitFor();
            await history.getByText('مبلغ سفارش ۱٬۲۰۰٬۰۰۰ ریال', { exact: true }).waitFor();
            await page.reload();
            await history.getByText(orderId, { exact: true }).waitFor();
            await history.getByRole('button', { name: 'شبیه‌سازی پرداخت' }).click();
            await history.getByText('پرداخت آزمایشی تأیید شد', { exact: true }).waitFor();

            await page.goto(`/shop/${garden.id}`);
            await page.getByRole('button', { name: 'افزودن به سبد آزمایشی' }).click();
            await page.getByRole('link', { name: 'مشاهدهٔ سبد آزمایشی' }).click();
            await page.getByRole('button', { name: 'ثبت سفارش آزمایشی', exact: true }).click();
            await receipt.getByRole('link', { name: 'مشاهدهٔ سفارش‌های آزمایشی' }).click();
            await history.getByRole('button', { name: 'لغو سفارش آزمایشی' }).click();
            await history.getByText('سفارش لغو شد', { exact: true }).waitFor();
            await page.reload();
            await history.getByText('پرداخت آزمایشی تأیید شد', { exact: true }).waitFor();
            await history.getByText('سفارش لغو شد', { exact: true }).waitFor();
            assert.equal(await history.getByRole('button', { name: 'شبیه‌سازی پرداخت' }).count(), 0);
            assert.equal(await history.getByRole('button', { name: 'لغو سفارش آزمایشی' }).count(), 0);
            console.log('Demo orders PASS: receipt, simulated payment, cancellation and history after reload');
          } finally {
            await browser.close();
          }
          JS
