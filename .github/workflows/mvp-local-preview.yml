name: MVP local preview

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/mvp-local-preview.yml'
      - 'scripts/real-stack-runner.mjs'
      - 'scripts/real-stack-api.py'

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AromanCo/Backend
          ref: e69c286f6758847c08077b12ab621341ebb2a557
          path: backend-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install ./backend-preview
      - name: Start the local preview and verify seeded catalog
        env:
          AROMAN_TEST_BACKEND_DIR: ${{ github.workspace }}/backend-preview
          AROMAN_TEST_PYTHON: python
        run: |
          log="$RUNNER_TEMP/aroman-preview.log"
          node scripts/real-stack-runner.mjs mvp-preview >"$log" 2>&1 &
          preview_pid=$!
          trap 'kill -TERM "$preview_pid" 2>/dev/null || true; wait "$preview_pid" || true; cat "$log"' EXIT
          for attempt in {1..90}; do
            if grep -q '^AROMAN API: ' "$log"; then break; fi
            kill -0 "$preview_pid"
            sleep 1
          done
          web="$(sed -n 's/^AROMAN MVP: //p' "$log")"
          api="$(sed -n 's/^AROMAN API: //p' "$log")"
          socket="$(sed -n 's/^Local FakeSMS socket: //p' "$log")"
          test -n "$web" && test -n "$api" && test -S "$socket"
          test "$(stat -c '%a' "$socket")" = 600
          curl --fail --silent --show-error --max-time 20 "$web/shop" -o /dev/null
          curl --fail --silent --show-error --max-time 20 "$api/products?limit=20" \
            | node -e 'const products=JSON.parse(require("node:fs").readFileSync(0,"utf8")); require("node:assert/strict").equal(products.length,6)'
